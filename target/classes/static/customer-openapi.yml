openapi: 3.1.0
info:
  title: Customer Management Microservice (customer-service)
  description: Reactive Open-API Contract managing Personal (Standard, VIP) and Enterprise (Standard, PYME) customers, legal signers, and account holders. Publishes synchronization events to Apache Kafka.
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway Entry Point
  - url: http://localhost:8081
    description: Direct Customer Service Instance

paths:
  /api/customers:
    get:
      summary: Retrieve all registered customers
      description: Returns a reactive stream of all Personal and Enterprise customers with their assigned profiles (STANDARD, VIP, PYME).
      operationId: getAllCustomers
      responses:
        '200':
          description: List of customers retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

    post:
      summary: Register a new customer (Personal VIP/Standard or Enterprise PYME/Standard)
      description: Creates a new customer in MongoDB and publishes a CustomerEvent to Kafka to synchronize local read replicas in account-service and credit-service.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
            examples:
              personalVip:
                summary: Personal VIP Customer
                value:
                  type: PERSONAL
                  profile: VIP
                  status: ACTIVE
                  personalInfo:
                    firstName: Ana
                    lastName: Gómez
                    documentType: DNI
                    documentNumber: "87654321"
                    email: ana.vip@bank.com
                    phone: "999111222"
              enterprisePyme:
                summary: Enterprise PYME Customer
                value:
                  type: ENTERPRISE
                  profile: PYME
                  status: ACTIVE
                  enterpriseInfo:
                    businessName: Tech Solutions S.A.C.
                    taxId: "20554433221"
                    address: Av. Javier Prado 450
                    corporateEmail: contacto@tech.pe
      responses:
        '201':
          description: Customer created successfully and event published to Kafka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid type/profile combination (e.g., PERSONAL with PYME or ENTERPRISE with VIP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/customers/{id}:
    get:
      summary: Find customer by hexadecimal ID
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId string (24 hex characters)
          schema:
            type: string
            example: 65f1a2b3c4d5e6f7a8b9c001
      responses:
        '200':
          description: Customer details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found.

    put:
      summary: Update an existing customer and profile
      description: Updates customer information or profile (e.g., upgrading STANDARD to VIP/PYME) and emits an UPDATED event to Kafka.
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 65f1a2b3c4d5e6f7a8b9c001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Customer updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid profile rule or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer ID does not exist.

    delete:
      summary: Delete a customer by ID
      operationId: deleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 65f1a2b3c4d5e6f7a8b9c001
      responses:
        '204':
          description: Customer deleted successfully.
        '404':
          description: Customer ID does not exist.

  /api/customers/holders:
    post:
      summary: Assign account holders and authorized signers to an enterprise account
      operationId: assignHolders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerHolder'
      responses:
        '201':
          description: Holders assigned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerHolder'
        '400':
          description: Invalid holder data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/customers/holders/account/{accountId}:
    get:
      summary: Retrieve assigned holders for a specific bank account ID
      operationId: getHoldersByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            example: 65f1a2b3c4d5e6f7a8b9c101
      responses:
        '200':
          description: Account holders retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerHolder'
        '404':
          description: No holders found for the given account ID.

components:
  schemas:
    Customer:
      type: object
      required:
        - type
        - status
      properties:
        id:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c001
        type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          example: PERSONAL
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
          default: STANDARD
          description: VIP applies only to PERSONAL; PYME applies only to ENTERPRISE.
          example: VIP
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
        personalInfo:
          $ref: '#/components/schemas/PersonalInfo'
        enterpriseInfo:
          $ref: '#/components/schemas/EnterpriseInfo'
        signers:
          type: array
          items:
            $ref: '#/components/schemas/Signer'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonalInfo:
      type: object
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gómez
        documentType:
          type: string
          enum: [DNI, PASSPORT, CE]
          example: DNI
        documentNumber:
          type: string
          example: "87654321"
        email:
          type: string
          format: email
          example: ana.vip@bank.com
        phone:
          type: string
          example: "999111222"

    EnterpriseInfo:
      type: object
      properties:
        businessName:
          type: string
          example: Tech Solutions S.A.C.
        taxId:
          type: string
          example: "20554433221"
        address:
          type: string
          example: Av. Javier Prado 450
        corporateEmail:
          type: string
          format: email
          example: contacto@tech.pe

    Signer:
      type: object
      properties:
        fullName:
          type: string
          example: Carlos Ruiz
        documentType:
          type: string
          example: DNI
        documentNumber:
          type: string
          example: "44556677"
        isPrimary:
          type: boolean
          example: true

    CustomerHolder:
      type: object
      required:
        - accountId
        - customerId
        - holders
      properties:
        id:
          type: string
        accountId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c101
        customerId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c002
        holders:
          type: array
          items:
            $ref: '#/components/schemas/Signer'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Un cliente PERSONAL solo admite perfil STANDARD o VIP