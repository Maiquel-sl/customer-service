spring:
  application:
    name: customer-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer-service-db}
  cloud:
    function:
      definition: customerEventProducer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        customerEventProducer-out-0:
          destination: customer-events
          content-type: application/json

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
    instances:
      bankServiceCB:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      bankServiceCB:
        baseConfig: default

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # Ruta del archivo que creaste
    url: /customer-openapi.yml
    # Cambia la ruta por defecto para acceder a la interfaz gráfica
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8081}