spring:
  application:
    name: customer-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer-service-db}
  cloud:
    function:
      definition: customerEventProducer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        customerEventProducer-out-0:
          destination: customer-events
          content-type: application/json

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # Ruta del archivo que creaste
    url: /customer-openapi.yml
    # Cambia la ruta por defecto para acceder a la interfaz gráfica
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8081}